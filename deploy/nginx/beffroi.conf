# Reverse proxy HTTPS Nginx devant Beffroi RM (installation native, Docker ou image seule).
# Paramètres TLS conformes au guide ANSSI « Recommandations de sécurité relatives à TLS »
# (ANSSI-PA-035) : TLS 1.2 et 1.3 uniquement, échange de clés ECDHE, suites AEAD, pas de
# compression ni de renégociation non sécurisée.
#
#   cp deploy/nginx/beffroi.conf /etc/nginx/conf.d/beffroi.conf   (ou sites-available + lien)
#   remplacer beffroi.exemple.fr et les chemins de certificat, puis : nginx -t && systemctl reload nginx
#
# Beffroi RM doit être lancé avec COOKIE_SECURE=true et TRUST_PROXY=true (valeurs par défaut
# de l'installateur Linux et de compose.yaml), et n'écouter que sur 127.0.0.1.

upstream beffroi {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP : redirection permanente vers HTTPS, rien d'autre.
server {
    listen 80;
    #listen [::]:80;              # IPv6 : décommenter si l'hôte l'utilise
    server_name beffroi.exemple.fr;
    return 301 https://$host$request_uri;
}

server {
    # « listen … ssl http2 » reste compris de toutes les versions (Debian 12 : 1.22, Ubuntu 24.04 : 1.24) ;
    # à partir de Nginx 1.25.1, préférer « listen 443 ssl; » suivi de « http2 on; ».
    listen 443 ssl http2;
    #listen [::]:443 ssl http2;   # IPv6 : décommenter si l'hôte l'utilise
    server_name beffroi.exemple.fr;

    ssl_certificate     /etc/ssl/beffroi/fullchain.pem;
    ssl_certificate_key /etc/ssl/beffroi/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_timeout 1h;
    ssl_session_cache shared:beffroi_tls:10m;
    ssl_session_tickets off;
    # Agrafage OCSP : à activer avec une IGC qui publie un répondeur OCSP.
    #ssl_stapling on;
    #ssl_stapling_verify on;
    #ssl_trusted_certificate /etc/ssl/beffroi/chain.pem;

    # HSTS, CSP, COOP, COEP, etc. sont posés par Beffroi RM (COOKIE_SECURE=true) : ne pas les dupliquer ici.
    server_tokens off;

    # Imports d'études (JSON) : même plafond que l'application.
    client_max_body_size 20m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    location / {
        proxy_pass http://beffroi;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Hôte tel que demandé, port compris : Beffroi RM le compare à l'en-tête Origin (anti-CSRF).
        proxy_set_header Host $http_host;
        # Adresse du client écrasée (et non ajoutée) : un X-Forwarded-For forgé par le client est ignoré.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
    }
}
