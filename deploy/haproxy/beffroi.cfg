# Reverse proxy HTTPS HAProxy devant Beffroi RM (installation native, Docker ou image seule).
# Paramètres TLS conformes au guide ANSSI « Recommandations de sécurité relatives à TLS »
# (ANSSI-PA-035) : TLS 1.2 et 1.3 uniquement, échange de clés ECDHE, suites AEAD.
# Testée avec HAProxy 2.8 ; directives disponibles depuis la 2.2 (RHEL 9 : 2.4, Debian 12 : 2.6).
#
#   cp deploy/haproxy/beffroi.cfg /etc/haproxy/haproxy.cfg   (ou fusionner avec la configuration existante)
#   le fichier PEM contient la chaîne de certificats suivie de la clé privée (0600, propriétaire haproxy) ;
#   haproxy -c -f /etc/haproxy/haproxy.cfg && systemctl reload haproxy
#
# Beffroi RM doit être lancé avec COOKIE_SECURE=true et TRUST_PROXY=true (valeurs par défaut
# de l'installateur Linux et de compose.yaml), et n'écouter que sur 127.0.0.1.

global
    log /dev/log local0
    user haproxy
    group haproxy
    chroot /var/lib/haproxy
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 120s
    timeout http-request 30s
    timeout http-keep-alive 10s

frontend http
    bind :80
    #bind [::]:80                 # IPv6 : décommenter si l'hôte l'utilise
    http-request redirect scheme https code 301

frontend https
    bind :443 ssl crt /etc/haproxy/certs/beffroi.pem alpn h2,http/1.1
    # IPv6 : décommenter si l'hôte l'utilise
    #bind [::]:443 ssl crt /etc/haproxy/certs/beffroi.pem alpn h2,http/1.1
    # Imports d'études (JSON) : même plafond que l'application (20 Mo).
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 20971520 }
    # Adresse du client écrasée (et non ajoutée) : un X-Forwarded-For forgé par le client est ignoré.
    http-request del-header X-Forwarded-For
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    # HSTS, CSP, COOP, COEP, etc. sont posés par Beffroi RM (COOKIE_SECURE=true).
    default_backend beffroi

backend beffroi
    option httpchk GET /api/health
    http-check expect status 200
    server app 127.0.0.1:8080 check inter 10s
