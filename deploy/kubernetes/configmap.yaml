# Configuration non secrète. Liste complète des variables : docs/guide-utilisation.md, § 1.5.
apiVersion: v1
kind: ConfigMap
metadata:
  name: beffroi
data:
  # Service PostgreSQL : à adapter (nom DNS du service ou de l'instance managée).
  DATABASE_URL: postgres://beffroi_app@postgres.bdd.svc:5432/beffroi
  # Connexion chiffrée et authentifiée vers la base (CA montée depuis le secret beffroi-app).
  #DATABASE_SSL: verify-full
  #DATABASE_SSL_CA_FILE: /run/secrets/beffroi/pg-ca.pem
  # TLS terminé par le contrôleur d'entrée (ingress.yaml).
  COOKIE_SECURE: "true"
  TRUST_PROXY: "true"
  MFA_POLICY: required
  # Journal d'audit sur la sortie standard, collecté avec les journaux des conteneurs.
  AUDIT_STDOUT: "true"
  LOG_LEVEL: info
  # Authentification unique OpenID Connect (facultative) : secret client dans beffroi-app (oidc_client_secret).
  #OIDC_ISSUER: https://sso.exemple.fr/realms/interne
  #OIDC_CLIENT_ID: beffroi
  #OIDC_REDIRECT_URI: https://beffroi.exemple.fr/api/auth/oidc/callback
  #OIDC_CLIENT_SECRET_FILE: /run/secrets/beffroi/oidc_client_secret
---
# Rôle propriétaire du schéma : lu par le seul conteneur d'initialisation (migrations).
apiVersion: v1
kind: ConfigMap
metadata:
  name: beffroi-migration
data:
  DATABASE_MIGRATION_URL: postgres://beffroi_owner@postgres.bdd.svc:5432/beffroi
  DATABASE_MIGRATION_PASSWORD_FILE: /run/secrets/beffroi-migration/db_owner_password
