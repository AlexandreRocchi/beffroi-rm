# Cloisonnement réseau (nécessite un plugin CNI qui applique les NetworkPolicy : Calico, Cilium…).
# Entrées : le seul contrôleur d'entrée. Sorties : DNS et PostgreSQL (et le fournisseur OIDC
# s'il est utilisé). Tout le reste est refusé : aucun flux sortant vers Internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: beffroi
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: beffroi
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx # espace de noms du contrôleur d'entrée
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # Résolution DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    # PostgreSQL : à adapter (espace de noms de la base, ou bloc ipBlock pour une instance externe).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bdd
      ports:
        - { port: 5432, protocol: TCP }
    # Fournisseur OIDC (facultatif) :
    #- to:
    #    - ipBlock: { cidr: 192.0.2.20/32 }
    #  ports:
    #    - { port: 443, protocol: TCP }
