# Beffroi RM : migrations du schéma dans un conteneur d'initialisation (rôle beffroi_owner, dont le
# secret n'est monté que là), puis application (rôle beffroi_app). Conforme au profil
# « restricted » : utilisateur non root, système de fichiers en lecture seule, aucune capacité,
# profil seccomp par défaut, pas de jeton d'API Kubernetes.
# Les migrations prennent un verrou PostgreSQL : plusieurs réplicas peuvent démarrer ensemble.
# Au-delà d'un réplica, les limites de débit (connexion, API) s'appliquent par réplica.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beffroi
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: beffroi
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: beffroi
        app.kubernetes.io/component: app
    spec:
      serviceAccountName: beffroi
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: beffroi
          imagePullPolicy: IfNotPresent
          command: ["node", "--disable-warning=ExperimentalWarning", "server/dist/server.js", "--migrate"]
          envFrom:
            - configMapRef:
                name: beffroi
            - configMapRef:
                name: beffroi-migration
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: secrets-migration
              mountPath: /run/secrets/beffroi-migration
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: beffroi
          image: beffroi
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: beffroi
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "8080"
            - name: DATABASE_PASSWORD_FILE
              value: /run/secrets/beffroi/db_app_password
            - name: BEFFROI_MASTER_KEY_FILE
              value: /run/secrets/beffroi/master_key
            - name: ADMIN_INITIAL_PASSWORD_FILE
              value: /run/secrets/beffroi/admin_initial_password
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/beffroi
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        # kubectl create secret generic beffroi-app --from-file=… (docs/installation.md)
        - name: secrets
          secret:
            secretName: beffroi-app
            defaultMode: 0440
        - name: secrets-migration
          secret:
            secretName: beffroi-migration
            defaultMode: 0440
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
        # Clé maître fournie par le secret : DATA_DIR ne contient rien de persistant.
        - name: data
          emptyDir: { sizeLimit: 16Mi }
